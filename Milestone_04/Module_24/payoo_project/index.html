<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Mobile App Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />

    <!-- Tailwind & Daisyui  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Outfit Font Google Link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!--Login Page  Logo Section 01 --------------------------------------- -->
    <div class="logo w-52 mx-auto pt-52">
      <img src="./image/Logo-full.png" alt="" />
    </div>
    <!-- Form Area Section 02 --------------------------------------- -->
    <div class="form">
      <div
        class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto mt-12 rounded-2xl"
      >
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label font-bold text-neutral">Mobile Number</label>
            <input
              maxlength="11"
              minlength="11"
              type="text"
              class="input rounded-full bg-base-200"
              placeholder="Enter your number"
            />
            <label class="label pt-5 font-bold text-neutral">4 Digit Pin</label>
            <input
              maxlength="4"
              minlength="4"
              type="password"
              class="input rounded-full bg-base-200"
              placeholder="Enter 4 Digit Pin"
            />

            <button class="btn btn-primary mt-4 rounded-full">Login</button>
          </fieldset>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
