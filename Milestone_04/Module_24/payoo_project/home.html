<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Home Page</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />

    <!-- Tailwind & Daisyui  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Outfit Font Google Link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b border-gray-300 sticky top-0 z-10 bg-white">
      <section class="w-11/12 py-3 mx-auto flex justify-between items-center">
        <!-- Left Nav ----------------- -->
        <div class="left flex gap-2">
          <div class="logo w-15">
            <img src="./image/logo.png" alt="" />
          </div>
          <div class="balance_Info">
            <h2 class="text-2xl font-bold">
              $ <span id="balance">25000</span>
            </h2>
            <p class="text-[#080808]/50">Available Balance</p>
          </div>
        </div>
        <!-- Right Nav ----------------- -->
        <div class="right text-neutral">
          <a href="./index.html" class="btn btn-soft"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a
          >
        </div>
      </section>
    </header>
    <main class="">
      <!-- Welcome Section here  -->
      <section class="container mx-auto px-5 py-10 space-y-5">
        <h2 class="text-3xl font-extrabold text-neutral">
          Welcome to Pay<span class="text-[#7460FF]">oo</span>
        </h2>
        <p class="text-[#080808]/60">
          Enjoy easy and convenient financial services with us. Cashout charge
          is low and
        </p>
        <!-- Grid Six Buttons Layous -->
        <div class="buttons grid grid-cols-3 gap-3">
          <!-- btn1 AddMoney  -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-1.png" alt="Button 1" />
            <p class="font-bold">Add Money</p>
          </button>
          <!-- btn2 Cashout -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-2.png" alt="Button 1" />
            <p class="font-bold">CashOut</p>
          </button>
          <!-- btn3 Send Money -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-3.png" alt="Button 1" />
            <p class="font-bold">Send Money</p>
          </button>
          <!-- btn4 Get Bonus -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-4.png" alt="Button 1" />
            <p class="font-bold">Get Bonus</p>
          </button>
          <!-- btn5 Pay Bill -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-5.png" alt="Button 1" />
            <p class="font-bold">Pay Bill</p>
          </button>
          <!-- btn6 Transactions -->
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="./image/opt-1.png" alt="Button 1" />
            <p class="font-bold">Transactions</p>
          </button>
        </div>
      </section>
      <!-- Cashout Section Here --------------------------- -->
      <section id="cashout" class="container mx-auto px-5 pb-10 hidden">
        <h2 class="text-2xl font-extrabold text-neutral pb-5">Cashout</h2>
        <div class="form">
          <div class="card bg-base-100 w-full shadow mx-auto rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-bold text-neutral">Agent Number</label>
                <input
                  id="agent_Num"
                  value="01560023030"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Agent number"
                />
                <label class="label font-bold text-neutral pt-5">Amount</label>
                <input
                  id="withdraw_Amount"
                  maxlength="11"
                  minlength="11"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Withdraw Amount"
                />
                <label class="label font-bold text-neutral pt-5"
                  >Pin Number</label
                >
                <input
                  id="withdraw_Pin"
                  maxlength="4"
                  minlength="4"
                  type="password"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter 4 Digit Pin"
                />

                <button
                  id="withdraw-btn"
                  class="btn btn-primary mt-4 rounded-full"
                >
                  Withdraw Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Add Money Section  -->
      <section id="addMoney" class="container mx-auto px-5 pb-10">
        <h2 class="text-2xl font-extrabold text-neutral pb-5">Add Money</h2>
        <div class="form">
          <div class="card bg-base-100 w-full shadow mx-auto rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-bold text-neutral"
                  >Select A Bank</label
                >
                <select id="add_money_bank" class="select w-full rounded-full">
                  <option disabled selected>Select Bank</option>
                  <option value="Dhaka Bank">Dhaka Bank</option>
                  <option value="Midland Bank">Midland Bank</option>
                  <option value="Brac Bank">Brac Bank</option>
                  <option value="City Bank">City Bank</option>
                </select>

                <label class="label font-bold text-neutral pt-5"
                  >Bank Account Number</label
                >
                <input
                  id="add_money_account_num"
                  value="01560023030"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Bank number"
                />
                <label class="label font-bold text-neutral pt-5"
                  >Amount to Add</label
                >
                <input
                  id="add_money_amount"
                  maxlength="11"
                  minlength="11"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Add Money Amount"
                />
                <label class="label font-bold text-neutral pt-5">
                  Add 4 Digit Pin Number</label
                >
                <input
                  id="add_money_pin"
                  maxlength="4"
                  minlength="4"
                  type="password"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter 4 Digit Pin"
                />

                <button
                  id="add_money_btn"
                  class="btn btn-primary mt-4 rounded-full"
                >
                  Add Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./script/utilities.js"></script>
    <script src="./script/withdraw.js"></script>
    <script src="./script/addMoney.js"></script>
  </body>
</html>
