<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Home Page</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />

    <!-- Tailwind & Daisyui  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Outfit Font Google Link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b border-gray-300">
      <section class="w-11/12 py-3 mx-auto flex justify-between items-center">
        <!-- Left Nav ----------------- -->
        <div class="left flex gap-2">
          <div class="logo w-15">
            <img src="./image/logo.png" alt="" />
          </div>
          <div class="balance_Info">
            <h2 class="text-2xl font-bold">
              $ <span id="balance">25000</span>
            </h2>
            <p class="text-[#080808]/50">Available Balance</p>
          </div>
        </div>
        <!-- Right Nav ----------------- -->
        <div class="right text-neutral">
          <a href="./index.html" class="btn btn-soft"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a
          >
        </div>
      </section>
    </header>
    <main class="w-11/12 pl-5 pr-5">
          <!-- Welcome Section here  -->
        <section class="pt-10 pb-10 space-y-3">
        <h2 class="text-3xl font-extrabold text-neutral">Welcome to Pay<span class="text-[#7460FF]">oo</span></h2>
          <p class="text-[#080808]/60">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
      </section>
    </main>
  </body>
</html>
